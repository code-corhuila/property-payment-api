server:
  port: ${PORT:3003}            # payment-api:3003 inside the network platform (deployment.md)
  shutdown: graceful            # stop accepting, let in-flight requests finish
  tomcat:
    connection-timeout: 5s      # time to receive the request line and headers
    keep-alive-timeout: 60s
    threads:
      max: 200
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    # The pool is built in PaymentConfiguration (the composition root), not by auto-configuration.
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
logging:
  structured:
    format:
      console: ecs              # one JSON object per line; the MDC adds correlationId

payment:
  # postgres (default) or memory. memory is for tests and local development only, never an
  # environment (norm 5.5.2): nothing persists. postgres without DATABASE_URL does not start.
  persistence: ${PERSISTENCE:postgres}
  database:
    # The schema lives in property-payment-db; this service never migrates it.
    url: ${DATABASE_URL:}
    user: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    pool-max: ${DB_POOL_MAX:10}
    statement-timeout-ms: ${DB_STATEMENT_TIMEOUT_MS:5000}
  pasarela:
    # Stripe in test mode (ADR-003). The key lives only in the variables file of the environment.
    url: ${STRIPE_URL:https://api.stripe.com}
    secret-key: ${STRIPE_SECRET_KEY:}
    timeout-ms: ${PASARELA_TIMEOUT_MS:3000}       # each call
    total-ms: ${PASARELA_TOTAL_MS:8000}           # the whole operation, below the workflow's 10 s
    max-attempts: ${PASARELA_MAX_ATTEMPTS:2}      # the same idempotency key on every attempt
    circuit:
      failures: ${PASARELA_CB_FAILURES:5}         # failed calls in a row that open the circuit
      open-ms: ${PASARELA_CB_OPEN_MS:30000}       # how long it stays open before one trial call
