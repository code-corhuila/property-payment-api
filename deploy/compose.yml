# This service only. property-infra-postgres includes this file to compose the platform.

services:
  payment-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "3003"
      # Public key of identity-service, one line with \n escapes. Never versioned.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY}
      # The schema payment of the single PostgreSQL instance, as payment_app (Annex J.7).
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      DATABASE_USER: payment_app
      DATABASE_PASSWORD: ${PAYMENT_APP_PASSWORD:?set PAYMENT_APP_PASSWORD}
      # The secret key of the Stripe test account (sk_test_...). Never versioned.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["3003"]
    networks: [platform]

  # The outbox relay (ADR-005; norm 5.3.11): the same image, another process. It publishes
  # the rows of payment.outbox_event to the exchange pagos of RabbitMQ as the broker user
  # payment; a row is marked only after the broker confirms it. The events of Payment have no
  # consumer in MVP 1 and are published anyway (ADR-013). One per environment; no port.
  payment-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["--outbox-relay"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      DATABASE_USER: payment_app
      DATABASE_PASSWORD: ${PAYMENT_APP_PASSWORD:?set PAYMENT_APP_PASSWORD}
      BROKER_HOST: rabbitmq
      BROKER_USER: payment
      BROKER_PASSWORD: ${PAYMENT_BROKER_PASSWORD:?set PAYMENT_BROKER_PASSWORD}
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
