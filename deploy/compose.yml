# This service only. property-infra-postgres includes this file to compose the platform.

services:
  payment-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "3003"
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["3003"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
